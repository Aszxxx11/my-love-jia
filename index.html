<!DOCTYPE html>
<html>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>告白</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; height: 100vh; }
        canvas { position: absolute; top:0; left:0; width: 100vw; height: 100vh; }
        .char { 
            position: absolute; font-size: 15vw; font-weight: 900; 
            font-family: 'Brush Script MT', cursive; 
            pointer-events: none; 
            text-shadow: 0 0 20px #ff00ff; 
            z-index: 5;
            animation: pop 0.4s ease-out;
        }
        @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <canvas id='c'></canvas>
    <script>
        const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const phrase = '蔡松志爱黄忆佳❤️';
        let index = 0, timer = null, particles = [];

        function isHeart(x, y) {
            const w = canvas.width, h = canvas.height;
            x = (x - w/2) / (w/4);
            y = -(y - h/2) / (h/4);
            return Math.pow(x*x + y*y - 1, 3) - x*x * Math.pow(y, 3) <= 0;
        }

        function createParticles(x, y, isExplosion) {
            const count = isExplosion ? 60 : 25;
            for(let i=0; i<count; i++) {
                let angle = Math.random() * Math.PI * 2;
                particles.push({ 
                    x, y, 
                    vx: Math.cos(angle)*(isExplosion?10:4), 
                    vy: Math.sin(angle)*(isExplosion?10:4), 
                    size: Math.random()*(isExplosion?6:3)+2, 
                    color: '#ff00ff', a:1 
                });
            }
        }

        function showChar(e) {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            const charDiv = document.createElement('div');
            charDiv.className = 'char';
            charDiv.innerText = phrase.charAt(index);
            charDiv.style.left = (x - 40) + 'px';
            charDiv.style.top = (y - 80) + 'px';
            charDiv.style.color = '#ff00ff';
            document.body.appendChild(charDiv);
            
            createParticles(x, y, index === phrase.length - 1);
            
            setTimeout(() => charDiv.remove(), 1000);
            index = (index + 1) % phrase.length;
            
            clearTimeout(timer);
            timer = setTimeout(() => { index = 0; }, 5000);
        }

        function loop() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            
            const opacity = 0.5 + 0.5 * Math.sin(Date.now() / 1000 * Math.PI);
            
            // 增加绘制密度，让爱心更显眼
            for(let i=0; i<1500; i++) {
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                if(isHeart(x, y)) {
                    ctx.fillStyle = 'rgba(255, 0, 255, ' + opacity + ')';
                    ctx.beginPath(); ctx.arc(x, y, 1.8, 0, 7); ctx.fill();
                }
            }
            particles.forEach((p,i) => {
                p.x += p.vx; p.y += p.vy; p.a -= 0.02;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
                if(p.a <= 0) particles.splice(i,1);
            });
            requestAnimationFrame(loop);
        }

        document.addEventListener('mousedown', showChar);
        document.addEventListener('touchstart', (e) => { e.preventDefault(); showChar(e); }, {passive: false});
        loop();
    </script>
</body>
</html>
